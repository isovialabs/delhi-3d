<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delhi 3D: city view</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfdbe6; font-family: system-ui, sans-serif; }
  #credit { position: fixed; right: 8px; bottom: 6px; font-size: 11px; color: #333;
            background: rgba(255,255,255,0.75); padding: 2px 6px; border-radius: 4px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="credit">Buildings: Google Open Buildings (CC BY 4.0) · Roads &amp; parks: © OpenStreetMap contributors (ODbL)</div>
<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- small helpers ----------
// repeatable "random" number in [0, 1) from an index, so the city looks the same every load
const rand = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const toPoints = (ring) => ring.map(([x, y]) => new THREE.Vector2(x, y));
const polygonArea = (r) => {
  let a = 0;
  for (let k = 0; k < r.length; k++) {
    const [x1, y1] = r[k], [x2, y2] = r[(k + 1) % r.length];
    a += x1 * y2 - x2 * y1;
  }
  return Math.abs(a) / 2;
};
const centroid = (r) => [r.reduce((s, p) => s + p[0], 0) / r.length, r.reduce((s, p) => s + p[1], 0) / r.length];
const inside = ([x, y], r) => {
  let c = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
};

// ---------- renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));  // cap resolution for speed
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfdbe6');
scene.fog = new THREE.Fog('#cfdbe6', 1500, 4000);        // light Delhi haze in the distance

const pmrem = new THREE.PMREMGenerator(renderer);         // soft reflected light
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.15;                        // low, so shadows stay dark

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 10000);
camera.position.set(900, 700, 900);

const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.2;                   // can't tilt below the ground
controls.minDistance = 50;
controls.maxDistance = 4000;

// ---------- light ----------
scene.add(new THREE.HemisphereLight('#e4eef7', '#8a8170', 0.5));  // soft sky light
const sun = new THREE.DirectionalLight('#fff4e0', 3.0);
sun.position.set(-700, 800, 700);                         // afternoon sun from the south-west
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1300, right: 1300, top: 1300, bottom: -1300, near: 10, far: 3000 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.5;
scene.add(sun);

// ---------- ground layers ----------
// Our data: x = east, y = north (metres from CP's centre).
// three.js: x = east, y = up, z = south. rotateX(-90°) maps (x, y) -> (x, 0, -y).
function addFlatLayer(parts, color, lift) {
  const geoms = parts.map(({ o, i }) => {
    const shape = new THREE.Shape(toPoints(o));
    i.forEach((hole) => shape.holes.push(new THREE.Path(toPoints(hole))));
    return new THREE.ShapeGeometry(shape);
  });
  const geom = mergeGeometries(geoms);
  geom.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color, roughness: 1 }));
  mesh.position.y = lift;                                 // tiny lift stops layers flickering
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// ---------- building styles ----------
const STYLE = {
  tower:     { wall: '#c9d3dc', roof: '#8e979f', glass: '#3d5a73', bay: 2.4, winW: 0.7, winH: 0.6,  tint: 0 },
  mid:       { wall: '#e6dfd1', roof: '#b9b3a6', glass: '#4a5560', bay: 3.0, winW: 0.5, winH: 0.45, tint: 1 },
  low:       { wall: '#f1ebdf', roof: '#c4bdb0', glass: '#4f5964', bay: 3.2, winW: 0.4, winH: 0.45, tint: 1 },
  estimated: { wall: '#b8bcc3', roof: '#a3a7ad' },        // no windows: its height is a guess
};

// Walls as quads. uv = (metres along this wall, metres above ground); aSeed = this building's random number
function wallGeometry(ring, h, seed) {
  const pos = [], uv = [];
  for (let k = 0; k < ring.length; k++) {
    const [x1, y1] = ring[k];
    const [x2, y2] = ring[(k + 1) % ring.length];
    const len = Math.hypot(x2 - x1, y2 - y1);
    const a = [x1, 0, -y1], b = [x2, 0, -y2], c = [x2, h, -y2], d = [x1, h, -y1];
    pos.push(...a, ...b, ...c, ...a, ...c, ...d);
    uv.push(0, 0, len, 0, len, h, 0, 0, len, h, 0, h);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('aSeed', new THREE.Float32BufferAttribute(new Float32Array(pos.length / 3).fill(seed), 1));
  g.computeVertexNormals();
  return g;
}

// A normal lit material, plus shader code for wall colour variety and windows
function windowMaterial(s) {
  const m = new THREE.MeshStandardMaterial({ color: s.wall, roughness: 0.85 });
  m.defines = { USE_UV: '' };
  m.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, {
      uBayW: { value: s.bay }, uFloorH: { value: 3.2 },
      uWinW: { value: s.winW }, uWinH: { value: s.winH },
      uTint: { value: s.tint },
      uGlass: { value: new THREE.Color(s.glass) },
    });
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float aSeed;
        varying float vSeed;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vSeed = aSeed;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uBayW, uFloorH, uWinW, uWinH, uTint;
        uniform vec3 uGlass;
        varying float vSeed;
        vec3 palette(float s) {                    // common Delhi wall colours
          if (s < 0.30) return vec3(0.95, 0.92, 0.86);   // cream
          if (s < 0.50) return vec3(0.93, 0.85, 0.70);   // ochre
          if (s < 0.65) return vec3(0.94, 0.86, 0.83);   // pale pink
          if (s < 0.85) return vec3(0.85, 0.85, 0.83);   // concrete grey
          return vec3(0.98, 0.98, 0.96);                 // white
        }
        float winMask(vec2 p, float bay, float ww) {
          if (p.y < uFloorH) {                     // ground floor: wide shopfronts
            float fx = fract(p.x / 4.0);
            return step(0.08, fx) * step(fx, 0.92) * step(0.15, p.y) * step(p.y, 2.6);
          }
          float fx = fract(p.x / bay);             // which window column
          float fy = fract(p.y / uFloorH);         // which floor
          float m = (1.0 - ww) * 0.5;
          return step(m, fx) * step(fx, 1.0 - m) * step(0.3, fy) * step(fy, 0.3 + uWinH);
        }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float s2 = fract(vSeed * 7.13);
        float s3 = fract(vSeed * 13.37);
        if (uTint > 0.5) diffuseColor.rgb = pow(palette(vSeed), vec3(2.2));
        diffuseColor.rgb *= 0.9 + 0.15 * s2;                                // brightness varies per building
        diffuseColor.rgb *= mix(0.8, 1.0, smoothstep(0.0, 1.5, vUv.y));      // grime at street level
        float bay = uBayW * (0.85 + 0.3 * s3);
        float ww = clamp(uWinW * (0.8 + 0.4 * s2), 0.2, 0.95);
        float win = winMask(vUv, bay, ww);
        float fade = smoothstep(500.0, 1400.0, length(vViewPosition));      // far away: blend to average
        win = mix(win, ww * uWinH * 0.9, fade);
        diffuseColor.rgb = mix(diffuseColor.rgb, uGlass, win);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.15, win);                  // glass is shiny`);
  };
  return m;
}

function addBuildings(list) {
  const walls = {}, roofs = {};
  list.forEach((b, i) => {
    (walls[b.c] ??= []).push(wallGeometry(b.p, b.h, rand(i)));
    const roof = new THREE.ShapeGeometry(new THREE.Shape(toPoints(b.p)));
    roof.rotateX(-Math.PI / 2);
    roof.translate(0, b.h, 0);
    (roofs[b.c] ??= []).push(roof);
  });
  for (const type of Object.keys(walls)) {
    const s = STYLE[type];
    const wallMat = s.glass
      ? windowMaterial(s)
      : new THREE.MeshStandardMaterial({ color: s.wall, roughness: 0.9 });
    const roofMat = new THREE.MeshStandardMaterial({ color: s.roof, roughness: 0.95 });
    for (const [geoms, mat] of [[walls[type], wallMat], [roofs[type], roofMat]]) {
      const mesh = new THREE.Mesh(mergeGeometries(geoms), mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    }
  }
}

// ---------- rooftop water tanks and stair blocks ----------
function addRoofProps(list) {
  const tanks = [], stairs = [];
  list.forEach((b, i) => {
    if (b.c !== 'low' && b.c !== 'mid') return;
    const area = polygonArea(b.p);
    if (area < 40) return;
    const [cx, cy] = centroid(b.p);
    const r = Math.sqrt(area) * 0.25;
    const t = [cx + (rand(i + 11) - 0.5) * r, cy + (rand(i + 23) - 0.5) * r];
    if (inside(t, b.p)) tanks.push([t[0], t[1], b.h]);
    const st = [cx - (rand(i + 11) - 0.5) * r * 1.6, cy - (rand(i + 23) - 0.5) * r * 1.6];
    if (area > 90 && rand(i + 31) < 0.6 && inside(st, b.p)) stairs.push([st[0], st[1], b.h]);
  });

  const place = (geo, mat, items) => {
    const mesh = new THREE.InstancedMesh(geo, mat, items.length);
    const m = new THREE.Matrix4();
    items.forEach(([x, y, h], i) => mesh.setMatrixAt(i, m.makeTranslation(x, h, -y)));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
  };
  const tankGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.3, 12);
  tankGeo.translate(0, 0.65, 0);
  const stairGeo = new THREE.BoxGeometry(2.8, 2.6, 2.8);
  stairGeo.translate(0, 1.3, 0);
  place(tankGeo, new THREE.MeshStandardMaterial({ color: '#1d1f22', roughness: 0.6 }), tanks);
  place(stairGeo, new THREE.MeshStandardMaterial({ color: '#d8d1c3', roughness: 0.95 }), stairs);
}

// ---------- trees ----------
function addTrees(list) {
  if (!list.length) return;
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.35, 3, 5);
  trunkGeo.translate(0, 1.5, 0);
  const crownGeo = new THREE.IcosahedronGeometry(3.2, 0);   // low-poly crown: 20 faces
  crownGeo.scale(1, 0.85, 1);
  crownGeo.translate(0, 5.5, 0);

  const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: '#5b4a3a', roughness: 1 }), list.length);
  const crowns = new THREE.InstancedMesh(crownGeo, new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9, flatShading: true }), list.length);

  const greens = ['#4f7a3a', '#5e8a44', '#3f6b33', '#6f9450'].map((c) => new THREE.Color(c));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  list.forEach(([x, y, k], i) => {
    p.set(x, 0, -y);
    q.setFromAxisAngle(up, rand(i) * Math.PI * 2);
    s.setScalar(k);
    m.compose(p, q, s);
    trunks.setMatrixAt(i, m);
    crowns.setMatrixAt(i, m);
    crowns.setColorAt(i, greens[Math.floor(rand(i + 7) * greens.length)]);
  });
  crowns.castShadow = true;                                // only crowns cast shadows
  for (const mesh of [trunks, crowns]) {
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
}

// ---------- build the city ----------
const base = new THREE.Mesh(
  new THREE.PlaneGeometry(8000, 8000),
  new THREE.MeshStandardMaterial({ color: '#a8a293', roughness: 1 })
);
base.rotation.x = -Math.PI / 2;
base.receiveShadow = true;
scene.add(base);

const [city, ground, trees] = await Promise.all([
  fetch('buildings.json').then((r) => r.json()),
  fetch('ground.json').then((r) => r.json()),
  fetch('trees.json').then((r) => (r.ok ? r.json() : { trees: [] })),
]);
addFlatLayer(ground.green, '#8fae6a', 0.05);
addFlatLayer(ground.roads, '#5d5f63', 0.1);
addBuildings(city.buildings);
addRoofProps(city.buildings);
addTrees(trees.trees);

// ---------- loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
